    <style>
        body { font-family: "Georgia", serif; background-color: #FDFBF7; color: #2C2C2E; margin: 0; padding: 0; line-height: 1.6; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; box-sizing: border-box; }

        .lang-btn.active { background-color: #1B5E20; color: #FFF; }

Use code with caution.My soul magnifies the Lord, and my spirit rejoices in God my Savior, for he has looked on the humble estate of his servant. For behold, from now on all generations will call me blessed;\n\nfor he who is mighty has done great things for me, and holy is his name. And his mercy is on those who fear him from generation to generation.\n\nHe has shown strength with his arm; he has scattered the proud in the thoughts of their hearts; he has brought down the mighty from their thrones and exalted those of humble estate; he has filled the hungry with good things, and the rich he has sent empty away.\n\nHe has helped his servant Israel, in remembrance of his mercy, as he spoke to our fathers, to Abraham and to his offspring forever., prayers: Traditional Closing DevotionsHail, Holy Queen (Salve Regina)Hail, Holy Queen, Mother of Mercy, our life, our sweetness and our hope. To thee do we cry, poor banished children of Eve; to thee do we send up our sighs, mourning and weeping in this valley of tears. Turn then, most gracious advocate, thine eyes of mercy toward us, and after this our exile, show unto us the blessed fruit of thy womb, Jesus. O clemens, o pia, o dulcis Virgo Maria. Amen.The MemorareRemember, O most gracious Virgin Mary, that never was it known that anyone who fled to thy protection, implored thy help, or sought thine intercession was left unaided. Inspired by this confidence, I fly unto thee, O Virgin of virgins, my Mother; to thee do we come, before thee we stand, sinful and sorrowful. O Mother of the Word Incarnate, despise not my petitions, but in thy mercy hear and answer me. Amen.}, ta: { title: "ஜெபமாலை துணைவன்", tabs: ["அட்டவணை", "மறைபொருட்கள்", "திருமுறை", "ஜெபங்கள்"], schedule:வாராந்திர மறைபொருள் வழிகாட்டிதினசரி பக்தியை ஒழுங்குபடுத்த ஜெபமாலையின் மறைபொருட்கள் வாரத்தின் குறிப்பிட்ட நாட்களுக்கு ஒதுக்கப்பட்டுள்ளன:திங்கள்: மகிழ்ச்சி நிறை மறைபொருட்கள்செவ்வாய்: துயரம் நிறை மறைபொருட்கள்புதன்: மகிமை நிறை மறைபொருட்கள்வியாழன்: ஒளி நிறை மறைபொருட்கள்வெள்ளி: துயரம் நிறை மறைபொருட்கள்சனி: மகிழ்ச்சி நிறை மறைபொருட்கள்ஞாயிறு: மகிமை நிறை மறைபொருட்கள், mysteries: மகிழ்ச்சி நிறை மறைபொருட்கள்1. கபிரியேல் தூதர் மரியாவுக்கு தூது உரைத்ததுமரியா தூய ஆவியின் வல்லமையால் இறைமகனை கருத்தாங்குவார் என்று கபிரியேல் வானதூதர் மரியாவுக்கு அறிவிக்கிறார்.2. மரியா எலிசபெத்தம்மாளை சந்தித்ததுமரியா தன் உறவினரான எலிசபெத்தை சந்திக்கச் செல்கிறார், அவர் மரியாவை ஆண்டவரின் தாயாக வாழ்த்துகிறார்.3. இயேசு கிறித்துவின் பிறப்புஇயேசு கிறிஸ்து பெத்லகேமில் உள்ள ஒரு எளிய மாட்டுத்தொழுவத்தில் பிறந்து, துணிகளில் சுற்றப்பட்டு தீவனத் தொட்டியில் வைக்கப்படுகிறார்.4. இயேசுவை ஆலயத்தில் அர்ப்பணித்ததுமோசேயின் சட்டப்படி மரியாவும் யோசேப்பும் குழந்தை இயேசுவை எருசலேம் ஆலயத்தில் இறைவனுக்கு அர்ப்பணிக்கிறார்கள்.5. காணாமல் போன இயேசுவை ஆலயத்தில் கண்டடைந்ததுமூன்று நாட்கள் தேடுதலுக்குப் பிறகு, மரியாவும் யோசேப்பும் சிறுவன் இயேசுவை ஆலயத்தில் அறிஞர்களுடன் உரையாடிக்கொண்டிருப்பதைக் காண்கிறார்கள்.ஒளி நிறை மறைபொருட்கள்1. இயேசு யோர்தான் ஆற்றில் திருமுழுக்கு பெற்றதுயோவான் இயேசுவுக்கு திருமுழுக்கு கொடுக்கும்போது தூய ஆவி புறா வடிவில் அவர் மேல் இறங்குகிறது. பிதா இவரைத் தம் அன்பார்ந்த மைந்தன் என அறிவிக்கிறார்.2. கானா ஊர் திருமணத்தில் இயேசு புதுமை செய்ததுஅன்னை மரியாவின் வேண்டுகோளுக்கு இணங்கி, இயேசு தண்ணீரைத் திராட்சை இரசமாக மாற்றி, தமது முதல் பொதுப் புதுமையைச் செய்கிறார்.3. இயேசு இறையாட்சியைப் பறைசாற்றியதுஇயேசு மனிதர்களை மனம்மாறும்படி அழைத்து, கடவுளின் அரசாங்கம் நெருங்கி வந்துவிட்டது என்று பறைசாற்றுகிறார்.4. இயேசு தாபோர் மலையில் உருமாறியதுஇயேசு தாபோர் மலையின் உச்சியில் பேதுரு, யாக்கோபு, யோவான் ஆகியோருக்குத் தமது தெய்வீக மகிமையை வெளிப்படுத்துகிறார்.5. இயேசு நற்கருணையை ஏற்படுத்தியதுஇறுதி இரவு உணவின் போது, இயேசு அப்பத்தையும் திராட்சை இரசத்தையும் தமது திருவுடலாகவும் திருஇரத்தமாகவும் மாற்றி நற்கருணையை ஏற்படுத்துகிறார்.துயரம் நிறை மறைபொருட்கள்1. இயேசு பூங்காவனத்தில் இரத்த வேர்வை சிந்தியதுஇயேசு கெத்சமனி தோட்டத்தில் தமது பாடுகளின் முன்தின இரவில் மிகுந்த வேதனையுடன் ஜெபித்து, பிதாவின் சித்தத்திற்குத் தம்மை அர்ப்பணிக்கிறார்.2. இயேசு கற்றூணில் கட்டப்பட்டு அடிபட்டதுஇயேசு ரோமானிய போர்வீரர்களால் கற்றூணில் கட்டப்பட்டு, கொடூரமாக சாட்டையால் அடிக்கப்படுகிறார்.3. இயேசுவுக்கு முள்முடி சூட்டியதுஇயேசுவின் அரச உரிமையைப் பரியாசம் செய்யும்பொருட்டு, கூர்மையான முட்களால் ஆன முடி அவர் தலையில் பலவந்தமாக அழுத்தப்படுகிறது.4. இயேசு சிலுவை சுமந்து சென்றதுஇயேசு கனமான மரச் சிலுவையைத் தமது தோள்களில் சுமந்து, எருசலேம் வீதிகள் வழியாக கல்வாரி மலையை நோக்கி நடக்கிறார்.5. இயேசு சிலுவையில் அறையப்பட்டு இறந்ததுஇயேசு சிலுவையில் ஆணிகளால் அறையப்பட்டு, நம்முடைய மீட்புக்காக மூன்று மணி நேரக் கடுமையான வேதனைக்குப் பிறகு உயிர்விடுகிறார்.மகிமை நிறை மறைபொருட்கள்1. இயேசு உயிர்த்தெழுந்ததுஇயேசு இறந்த மூன்றாம் நாள் மகிமையோடு உயிர்த்தெழுந்து, பாவத்தையும் மரணத்தையும் என்றென்றைக்குமாக வென்றார்.2. இயேசு விண்ணேகியதுஉயிர்த்தெழுந்த நாற்பதாம் நாளில், இயேசு உடலோடும் ஆன்மாவோடும் விண்ணகத்திற்கு ஏறி, பிதாவின் வலப்பக்கத்தில் வீற்றிருக்கிறார்.3. தூய ஆவியார் எழுந்தருளியதுஅன்னை மரியாவும் அப்போஸ்தலர்களும் மேல்மாடி அறையில் கூடியிருந்தபோது, தூய ஆவியார் நெருப்பு நாவுகளின் வடிவில் அவர்கள் மேல் இறங்கி வந்தார்.4. அன்னை மரியா விண்ணகத்திற்கு எடுத்துக் கொள்ளப்பட்டதுமரியா தமது உலக வாழ்வின் முடிவில், உடலோடும் ஆன்மாவோடும் விண்ணக மகிமைக்கு எடுத்துக் கொள்ளப்பட்டார்.5. அன்னை மரியாவுக்கு விண்ணக அரசியாக முடிசூட்டியதுமரியா தமது தெய்வீகக் குமாரனால் விண்ணுலகிற்கும் மண்ணுலகிற்கும் அரசியாக முடிசூட்டப்பட்டார், அவர் நமக்குப் பரிந்து பேசும் தாயாக இருக்கிறார்., scripture: மரியாவின் பாடல் (Magnificat)எனது உள்ளம் ஆண்டவரை ஏத்திப் போற்றுகின்றது. எனது மீட்பராம் கடவுளை நினைத்து எனது மனம் மகிழ்ச்சியடைகின்றது. ஏனெனில் அவர் தம் அடிமையின் தாழ்நிலையைக் கண்ணோக்கினார். இதுமுதல் எல்லாத் தலைமுறையினரும் என்னைப்பேறுபெற்றவர் என்பர்.\n\nஏனெனில் வல்லமையுடையவர் எனக்குப் பெரியன செய்துள்ளார். அவரது பெயர் தூயது. அஞ்சுவோருக்கு அவர் தலைமுறை தலைமுறையாய் இரக்கம் காட்டி வருகிறார்.\n\nஅவர் தம் தோள் வலிமையைக் காட்டியுள்ளார்; உள்ளத்தில் செருக்குடன் சிந்திப்போரைச் சிதறடித்துள்ளார். வலியோரை அரியணையினின்று தூக்கி எறிந்துள்ளார்; தாழ்நிலையில் இருப்போரை உயர்த்தியுள்ளார். பசித்தோரை நலன்களால் நிரப்பியுள்ளார்; செல்வரை வெறுங்கையராய் அனுப்பிவி்ட்டார்.\n\nநம் முதாதையருக்கு உரைத்தபடியே அவர் ஆபிர
